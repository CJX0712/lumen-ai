[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumen-ai"
version = "0.1.0"
description = "模块化端到端可运行 AI 系统 (RAG + Agent + Tools)，复用业界领先开源成果，单一职责模块化，可插拔后端，一键可复现。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
keywords = ["ai", "rag", "agent", "llm", "ollama", "modular"]
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "faiss-cpu>=1.7",
    "ollama>=0.1.0",
    "openai>=1.12",
    "typer>=0.12",
    "gradio>=4.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lumen = "lumen.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: 需要真实 LLM / 嵌入后端 (Ollama) 的集成测试",
]
